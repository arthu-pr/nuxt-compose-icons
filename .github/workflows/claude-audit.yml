name: Claude Dependency & Security Audit

on:
  schedule:
    - cron: '0 6 * * 1' # Every Monday at 06:00 UTC
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          node_version: 22
          cache: 'pnpm'

      - name: Run Claude dependency & security audit
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}

            Audit this pnpm workspace for dependency health and security issues.

            Renovate already opens PRs for routine version bumps here (config in
            renovate.json), so don't just restate what it will already handle.
            Focus on what it won't catch:

            1. Run `pnpm audit` across the workspace and `pnpm outdated -r`.
            2. For anything flagged, check whether it's in `packages/nuxt`
               (the published module - dependencies are @nuxt/kit, svg-parser,
               svgo) versus docs/examples/dev tooling. Module runtime deps are
               higher priority than dev-only tooling.
            3. Look for packages that are deprecated, unmaintained (no release
               in 12+ months, archived repo), or have a known advisory that
               Renovate's automerge could land without anyone noticing.
            4. Skip anything already covered by an open Renovate PR - check
               with `gh pr list --search "renovate"` first.

            This audit maintains a single persistent issue titled exactly
            "Dependency audit" (no date in the title) - the same pattern as
            Renovate's own "Dependency Dashboard" issue in this repo. Before
            doing anything else, check whether it already exists:

              gh issue list --repo ${{ github.repository }} --search 'in:title "Dependency audit"' --state open

            - If it exists, replace its entire body with your fresh findings
              (`gh issue edit <number> --body-file <file>`) - don't append or
              comment, the body should always reflect only the current state.
              Start the body with "Last updated: <date>". Carry forward any
              still-open item you re-verify as still true; drop anything now
              resolved.
            - If it doesn't exist yet and you have actionable findings, create
              it with that exact title.
            - If nothing actionable is found: if the issue exists, update its
              body to say so (don't close it - Renovate's dashboard stays open
              too); if it doesn't exist, don't create one.

            This is a read-only audit: do not modify any files, do not open
            or push to branches, do not open PRs.

          claude_args: |
            --allowedTools "Read,Bash(pnpm audit),Bash(pnpm outdated:*),Bash(gh issue:*),Bash(gh pr list:*)"
