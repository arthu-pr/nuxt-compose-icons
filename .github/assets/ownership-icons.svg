
  <svg viewBox="0 0 640 820" role="img" aria-label="Icon pipeline flow: Design team (role) produces SVG source assets (data), which feed the UI Library package boundary containing SVG assets (data) and Generated, themed components (process); Developers (role) import the finished components.">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="currentColor"></path>
      </marker>
    </defs>

    <!-- Row 1: Design team (terminator) -->
    <rect x="60" y="30" width="520" height="170" rx="36" fill="var(--surface)" stroke="var(--text)" stroke-width="1.8"></rect>
    <text x="320" y="72" text-anchor="middle" class="diagram-text" font-size="19" font-weight="650" fill="var(--text)">Design team</text>
    <text x="320" y="106" text-anchor="middle" class="diagram-text" font-size="14" fill="var(--text-muted)">Design owns the rules and source assets.</text>
    <text x="320" y="128" text-anchor="middle" class="diagram-text" font-size="14" fill="var(--text-muted)">Sizes, colors, which could also vary</text>
    <text x="320" y="150" text-anchor="middle" class="diagram-text" font-size="14" fill="var(--text-muted)">over time.</text>

    <!-- Arrow 1 -->
    <line x1="320" y1="200" x2="320" y2="226" stroke="var(--text)" stroke-width="1.8" marker-end="url(#arrow)"></line>

    <!-- Row 2: SVG source assets (data / parallelogram) -->
    <polygon points="190,230 490,230 450,290 150,290" fill="var(--surface-2)" stroke="var(--text)" stroke-width="1.8"></polygon>
    <text x="320" y="266" text-anchor="middle" class="diagram-text" font-size="15" font-weight="600" fill="var(--text)">SVG source assets</text>

    <!-- Arrow 2, with annotation -->
    <line x1="320" y1="290" x2="320" y2="346" stroke="var(--text)" stroke-width="1.8" marker-end="url(#arrow)"></line>
    <text x="345" y="322" text-anchor="start" class="diagram-text" font-size="13" fill="var(--text-muted)">source of truth for icons</text>

    <!-- Row 3: UI Library package (module boundary) -->
    <rect x="90" y="350" width="460" height="210" rx="12" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-dasharray="6 4"></rect>
    <text x="110" y="376" class="diagram-text" font-size="11.5" font-weight="700" letter-spacing="0.06em" fill="var(--accent)">UI LIBRARY PACKAGE</text>

    <!-- SVG assets (data / parallelogram) -->
    <polygon points="165,396 385,396 355,446 135,446" fill="var(--surface-2)" stroke="var(--text)" stroke-width="1.6"></polygon>
    <text x="260" y="426" text-anchor="middle" class="diagram-text" font-size="14" font-weight="600" fill="var(--text)">SVG assets</text>
    <text x="400" y="426" text-anchor="start" class="diagram-mono" font-size="12.5" fill="var(--text-muted)">nuxt-compose-icons →</text>

    <line x1="260" y1="446" x2="300" y2="470" stroke="var(--text)" stroke-width="1.4" marker-end="url(#arrow)"></line>

    <!-- Generated, themed components (process / rectangle) -->
    <rect x="140" y="470" width="380" height="60" rx="8" fill="var(--surface)" stroke="var(--text)" stroke-width="1.6"></rect>
    <text x="330" y="506" text-anchor="middle" class="diagram-text" font-size="14.5" font-weight="600" fill="var(--text)">Generated, themed components</text>

    <!-- Arrow 3, with annotation -->
    <line x1="320" y1="560" x2="320" y2="606" stroke="var(--text)" stroke-width="1.8" marker-end="url(#arrow)"></line>
    <text x="345" y="588" text-anchor="start" class="diagram-text" font-size="13" fill="var(--text-muted)">developers import components only</text>

    <!-- Row 4: Developers (terminator) -->
    <rect x="60" y="610" width="520" height="170" rx="36" fill="var(--surface)" stroke="var(--text)" stroke-width="1.8"></rect>
    <text x="320" y="652" text-anchor="middle" class="diagram-text" font-size="19" font-weight="650" fill="var(--text)">Developers</text>
    <text x="320" y="686" text-anchor="middle" class="diagram-text" font-size="14" fill="var(--text-muted)">Developers launch their dev environment</text>
    <text x="320" y="708" text-anchor="middle" class="diagram-text" font-size="14" fill="var(--text-muted)">and use the library to demonstrate the</text>
    <text x="320" y="730" text-anchor="middle" class="diagram-text" font-size="14" fill="var(--text-muted)">components in context.</text>
  </svg>

