<svg viewBox="0 0 640 920" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Icon pipeline: Design team produces SVG source assets, consumed by the UI Library package (SVG assets, Generated themed components), imported by Developers into App 1, App 2, App 3.">
  <rect x="0" y="0" width="640" height="920" fill="#140d0b"/>

  <!-- Design team (terminator) -->
  <rect x="70" y="30" width="500" height="170" rx="40" fill="none" stroke="#d9464b" stroke-width="2"/>
  <rect x="220" y="50" width="200" height="44" fill="#d9464b"/>
  <text x="320" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="900" fill="#ffffff">Design team</text>
  <text x="320" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#98989f">Design owns the rules and source assets.</text>
  <text x="320" y="154" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#98989f">Sizes, colors, which could also vary over</text>
  <text x="320" y="176" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#98989f">time</text>

  <!-- arrow (plain) -->
  <line x1="320" y1="212" x2="320" y2="228" stroke="#98989f" stroke-width="1.6"/>
  <polygon points="313,228 327,228 320,238" fill="#98989f"/>

  <!-- SVG source assets (data / parallelogram) -->
  <polygon points="190,246 490,246 450,302 150,302" fill="#241a17" stroke="#4a332e" stroke-width="1.6"/>
  <text x="320" y="279" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#f4ece7">SVG source assets</text>

  <!-- arrow + label (beside, vertically centered) -->
  <line x1="320" y1="314" x2="320" y2="330" stroke="#98989f" stroke-width="1.6"/>
  <polygon points="313,330 327,330 320,340" fill="#98989f"/>
  <text x="335" y="330" text-anchor="start" font-family="system-ui, sans-serif" font-size="13" fill="#98989f">Source of truth for icons</text>

  <!-- UI Library package (module boundary, single column) -->
  <rect x="70" y="350" width="500" height="212" rx="12" fill="none" stroke="#d9464b" stroke-width="1.8" stroke-dasharray="6 4"/>
  <rect x="84" y="344" width="150" height="16" fill="#140d0b"/>
  <text x="90" y="356" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#d9464b">UI Library package</text>

  <polygon points="225,396 445,396 415,446 195,446" fill="#241a17" stroke="#4a332e" stroke-width="1.6"/>
  <text x="320" y="426" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#f4ece7">SVG assets</text>

  <line x1="320" y1="457" x2="320" y2="473" stroke="#98989f" stroke-width="1.6"/>
  <polygon points="313,473 327,473 320,483" fill="#98989f"/>
  <text x="335" y="477" text-anchor="start" font-family="ui-monospace, monospace" font-size="14" fill="#98989f">nuxt-compose-icons</text>

  <rect x="170" y="492" width="300" height="50" rx="8" fill="#241a17" stroke="#4a332e" stroke-width="1.6"/>
  <text x="320" y="522" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14.5" font-weight="600" fill="#f4ece7">Generated, themed components</text>

  <!-- arrow + label -->
  <line x1="320" y1="574" x2="320" y2="590" stroke="#98989f" stroke-width="1.6"/>
  <polygon points="313,590 327,590 320,600" fill="#98989f"/>
  <text x="335" y="594" text-anchor="start" font-family="system-ui, sans-serif" font-size="13" fill="#98989f">developers import components only</text>

  <!-- Developers (terminator) -->
  <rect x="70" y="610" width="500" height="170" rx="40" fill="none" stroke="#d9464b" stroke-width="2"/>
  <rect x="220" y="630" width="200" height="44" fill="#d9464b"/>
  <text x="320" y="658" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Developers</text>
  <text x="320" y="692" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#98989f">Developers launch their dev environment</text>
  <text x="320" y="714" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#98989f">and use the library to demonstrate the</text>
  <text x="320" y="736" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#98989f">components in context.</text>

  <!-- arrow (plain) -->
  <line x1="320" y1="792" x2="320" y2="808" stroke="#98989f" stroke-width="1.6"/>
  <polygon points="313,808 327,808 320,818" fill="#98989f"/>

  <!-- consumer apps -->
  <rect x="90" y="826" width="140" height="60" rx="8" fill="#241a17" stroke="#4a332e" stroke-width="1.6"/>
  <text x="160" y="862" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#f4ece7">App 1</text>

  <rect x="250" y="826" width="140" height="60" rx="8" fill="#241a17" stroke="#4a332e" stroke-width="1.6"/>
  <text x="320" y="862" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#f4ece7">App 2</text>

  <rect x="410" y="826" width="140" height="60" rx="8" fill="#241a17" stroke="#4a332e" stroke-width="1.6"/>
  <text x="480" y="862" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#f4ece7">App 3</text>
</svg>
